# Smithery MCP Server Manifest
# https://smithery.ai/docs/config

name: icx-mcp
title: Calera Infinite Context (ICX) — Persistent Memory
description: Persistent long-term memory and sub-5ms associative recall for AI agents and LLMs with zero context window decay.
homepage: https://icx.caleralabs.com/mcp
icon: https://caleralabs.com/assets/calera-labs-logo.svg
license: Apache-2.0
publisher: Calera Labs
tags:
  - infinite-context
  - persistent-memory
  - memory
  - associative-recall
  - zero-loss
  - volumetric-lattice
  - calera-labs

# Transport configuration (Streamable Remote HTTP)
transport:
  type: http
  url: https://icx.caleralabs.com/mcp

# Authentication & Configuration Requirements (Smithery Session Config)
configSchema:
  type: object
  properties:
    licenseKey:
      type: string
      title: API License Key
      description: Calera Labs API key (obtain free at https://dashboard.caleralabs.com).
      x-from:
        header: X-License-Key
    spaceId:
      type: string
      title: Memory Space ID
      description: Optional memory partition space ID (e.g., 'default', 'project_alpha', 'legal_vault'). Defaults to 'default'.
      default: "default"
      x-from:
        header: X-Space-ID
  required:
    - licenseKey

config:
  type: object
  properties:
    X-License-Key:
      type: string
      title: Calera Labs API License Key
      description: Calera Labs API key (obtain free at https://dashboard.caleralabs.com).
      isSecret: true
      x-from:
        header: X-License-Key
    X-Space-ID:
      type: string
      title: Memory Space Partition ID
      description: Optional memory partition space ID (e.g., 'default', 'project_alpha', 'legal_vault'). Defaults to 'default'.
      default: "default"
      x-from:
        header: X-Space-ID
  required:
    - X-License-Key

# Certified 6-Tool Surface Area with Input & Output Schemas
tools:
  - name: icx_remember
    version: 1.0.0
    description: >-
      Stores text, documents, code snippets, or conversational facts into long-term persistent memory for later retrieval across sessions. Ingests content into topological memory nodes with zero context window decay. Use this tool whenever you need to save facts, contracts, documentation, or user details for future reference. Do not use for querying existing memory (use icx_recall_scoped or icx_search_facts instead). Ingestion is additive and non-destructive.
    annotations:
      title: Memorize Document or Fact
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        text:
          type: string
          description: The raw text, markdown document, code file, or factual statement to memorize.
        space_id:
          type: string
          description: Optional memory space partition (e.g. 'codebase_docs', 'contracts_v2', 'user_preferences'). Defaults to caller default space.
        filename:
          type: string
          description: Optional filename or document title provenance tag (e.g. 'architecture.md', 'master_agreement.pdf') to track document origin.
        family:
          type: string
          description: Optional document family grouping for deterministic verbatim register quoting (e.g. 'contract.indemnity', 'auth.tokens').
      required:
        - text
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Crystallization status (VERIFIED_STORED | error)
        space_id:
          type: string
          description: Target memory space partition
        filename:
          type: string
          description: Stored document identifier
        family:
          type: string
          description: Document semantic family
        learned_facts:
          type: integer
          description: Count of new simplicial facts learned
        active_nodes:
          type: integer
          description: Total active nodes in memory space
        bytes_ingested:
          type: integer
          description: Raw bytes stored in verbatim register
        persisted_state:
          type: string
          description: Storage layer provenance
      required:
        - status
        - space_id
        - filename
        - learned_facts
        - active_nodes
        - bytes_ingested
        - persisted_state

  - name: icx_recall_scoped
    version: 1.0.0
    description: >-
      Performs associative semantic recall across long-term memory to retrieve grounded facts, citations, and source documents matching a natural language question. Use this tool when answering questions about previously saved documents or facts (e.g. 'What is the pricing tier?', 'Who is the lead architect?'). If you only need raw keyword matching across entity names, use icx_search_facts instead. For character-exact verbatim quotes of stored documents, use icx_quote_slot. Read-only with no side effects.
    annotations:
      title: Scoped Memory Recall
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Natural language question, keyword, or concept to recall from persistent lattice memory.
        space_id:
          type: string
          description: Optional memory space partition to restrict recall to. Defaults to caller default space.
        top_k:
          type: number
          description: Maximum number of grounded facts to retrieve (default: 10, min: 1, max: 50).
      required:
        - query
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Recall status (VERIFIED_RECALL | NO_GROUNDED_FACTS_FOUND)
        query:
          type: string
          description: Natural language query submitted
        space_id:
          type: string
          description: Target memory space partition
        count:
          type: integer
          description: Number of grounded facts returned
        facts:
          type: array
          description: List of recalled grounded facts and citations
          items:
            type: object
        total_in_space:
          type: integer
          description: Total nodes in active memory space
      required:
        - status
        - query
        - space_id
        - count
        - facts
        - total_in_space

  - name: icx_search_facts
    version: 1.0.0
    description: >-
      Searches memory lattice nodes and decoded facts by keyword overlap and proximity across the active memory space. Use this tool for entity exploration or keyword discovery. For natural language question answering with grounded factual citations, use icx_recall_scoped instead. Read-only with no side effects.
    annotations:
      title: Search Simplicial Lattice Facts
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Search terms or entity names to search across memory nodes.
        space_id:
          type: string
          description: Optional memory space partition to search within. Defaults to caller default space.
        limit:
          type: number
          description: Maximum number of node matches to return (default: 20, min: 1, max: 100).
      required:
        - query
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Search status
        query:
          type: string
          description: Search keyword query
        space_id:
          type: string
          description: Target memory space partition
        count:
          type: integer
          description: Number of matching nodes found
        matches:
          type: array
          description: Simplicial complex nodes matching search query
          items:
            type: object
        total_in_space:
          type: integer
          description: Total nodes in active memory space
      required:
        - status
        - query
        - space_id
        - count
        - matches
        - total_in_space

  - name: icx_quote_slot
    version: 1.0.0
    description: >-
      Retrieves exact character-for-character verbatim text quotes from stored document registers by document family and ordinal slot index. Use this tool when exact contractual wording, legal clauses, or code revisions must be quoted without AI paraphrasing. Use icx_recall_scoped for semantic QA instead. Read-only with no side effects.
    annotations:
      title: Verbatim Register Quoting
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        family:
          type: string
          description: Document family identifier (e.g. 'contract.indemnity', 'msa.pricing').
        index:
          type: number
          description: 1-based ordinal member index (e.g. 1 for first revision, 2 for second revision).
        space_id:
          type: string
          description: Optional memory space partition where the family was stored. Defaults to caller default space.
      required:
        - family
        - index
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Retrieval status (VERIFIED_VERBATIM_QUOTE | REGISTER_SLOT_EMPTY)
        family:
          type: string
          description: Document family category
        index:
          type: integer
          description: Ordinal slot index (1-based)
        space_id:
          type: string
          description: Target memory space partition
        exact_quote:
          type: string
          description: Verbatim character-exact text stored in register
        source_uri:
          type: string
          description: Original document source URI
        sha256:
          type: string
          description: Cryptographic content hash
      required:
        - status
        - family
        - index
        - space_id
        - exact_quote
        - source_uri
        - sha256

  - name: icx_inspect_space
    version: 1.0.0
    description: >-
      Audits and retrieves real-time telemetry for a partitioned memory space (active node count, total synapses, grounded facts count, memory state, and contradiction alarms). Use this tool to monitor memory health, verify ingestion, or inspect space capacity. Read-only with no side effects.
    annotations:
      title: Inspect Memory Space Telemetry
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        space_id:
          type: string
          description: Optional memory space partition to inspect. Defaults to caller default space.
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Space inspection status
        space_id:
          type: string
          description: Target memory space partition
        active_nodes:
          type: integer
          description: Active topological simplicial nodes
        total_synapses:
          type: integer
          description: Total learned neural synapses
        grounded_facts_count:
          type: integer
          description: Total decoded grounded facts
        contradictions_detected:
          type: integer
          description: Contradiction alarms in space
        state:
          type: string
          description: Memory space state (active | idle)
      required:
        - status
        - space_id
        - active_nodes
        - total_synapses
        - grounded_facts_count
        - contradictions_detected
        - state

  - name: icx_reset_session
    version: 1.0.0
    description: >-
      Resets conversational dialogue history for a session while strictly preserving all underlying crystallized knowledge, learned facts, and document weights in the memory space. Use when starting a new conversation topic while retaining all learned knowledge. Mutates session dialogue state but leaves persistent memory intact.
    annotations:
      title: Reset Conversation History
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        space_id:
          type: string
          description: Optional memory space partition whose turn history should be reset. Defaults to caller default space.
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Reset status (SESSION_RESET_SUCCESS)
        space_id:
          type: string
          description: Target memory space partition
        session_cleared:
          type: boolean
          description: Whether dialogue turns were cleared
        memory_crystallized_preserved:
          type: boolean
          description: Strictly true - underlying lattice memory is preserved
      required:
        - status
        - space_id
        - session_cleared
        - memory_crystallized_preserved
