# Smithery MCP Server Manifest
# https://smithery.ai/docs/config

name: icx-mcp
title: Calera Infinite Context (ICX) — Persistent Memory
description: Persistent long-term memory and sub-5ms associative recall for AI agents and LLMs with zero context window decay.
homepage: https://icx.caleralabs.com/mcp
icon: https://caleralabs.com/assets/calera-labs-logo.svg
license: Apache-2.0
publisher: Calera Labs
tags:
  - infinite-context
  - persistent-memory
  - memory
  - associative-recall
  - zero-loss
  - volumetric-lattice
  - calera-labs

# Transport configuration (Streamable Remote HTTP / 2026-07-28 Stateless Core)
transport:
  type: http
  url: https://icx.caleralabs.com/mcp
  protocolVersion: "2026-07-28"
  stateless: true

# Authentication & Configuration Requirements (Smithery Session Config)
configSchema:
  type: object
  properties:
    licenseKey:
      type: string
      title: API License Key
      description: Calera Labs API key (obtain free at https://dashboard.caleralabs.com).
      x-from:
        header: X-License-Key
    spaceId:
      type: string
      title: Memory Space ID
      description: Optional memory partition space ID (e.g., 'default', 'project_alpha', 'legal_vault'). Defaults to 'default'.
      default: "default"
      x-from:
        header: X-Space-ID
  required:
    - licenseKey

config:
  type: object
  properties:
    X-License-Key:
      type: string
      title: Calera Labs API License Key
      description: Calera Labs API key (obtain free at https://dashboard.caleralabs.com).
      isSecret: true
      x-from:
        header: X-License-Key
    X-Space-ID:
      type: string
      title: Memory Space Partition ID
      description: Optional memory partition space ID (e.g., 'default', 'project_alpha', 'legal_vault'). Defaults to 'default'.
      default: "default"
      x-from:
        header: X-Space-ID
  required:
    - X-License-Key

# Certified 6-Tool Surface Area with Input & Output Schemas
tools:
  - name: icx_remember
    version: 1.0.0
    description: >-
      Stores text documents, code snippets, architectural decisions, and factual knowledge into persistent long-term memory partitioned by space_id. Use this tool when saving important facts, project conventions, API keys, user preferences, or documentation for future sessions. Do NOT use for retrieving stored memory (use icx_recall_scoped for semantic QA, icx_search_facts for keyword lookup, or icx_quote_slot for verbatim quotes). Ingestion is additive and non-destructive: creates new memory nodes without overwriting or mutating existing records. Requires X-License-Key authentication.
    annotations:
      title: Memorize Document or Fact
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        text:
          type: string
          description: The raw text, markdown document, code file, or factual statement to memorize (max ~500KB per call).
        space_id:
          type: string
          description: Optional memory space partition (e.g. 'default', 'codebase_docs', 'contracts_v2', 'user_preferences'). Defaults to 'default'.
        filename:
          type: string
          description: Optional filename or document title provenance tag (e.g. 'architecture.md', 'master_agreement.pdf') to track document origin.
        family:
          type: string
          description: Optional document family grouping for deterministic verbatim register quoting (e.g. 'contract.indemnity', 'auth.tokens'). When set, allows verbatim retrieval via icx_quote_slot.
      required:
        - text
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Crystallization status (VERIFIED_STORED | error)
        space_id:
          type: string
          description: Target memory space partition
        filename:
          type: string
          description: Stored document identifier
        family:
          type: string
          description: Document semantic family
        learned_facts:
          type: integer
          description: Count of new simplicial facts learned
        active_nodes:
          type: integer
          description: Total active nodes in memory space
        bytes_ingested:
          type: integer
          description: Raw bytes stored in verbatim register
        persisted_state:
          type: string
          description: Storage layer provenance
      required:
        - status
        - space_id
        - filename
        - learned_facts
        - active_nodes
        - bytes_ingested
        - persisted_state

  - name: icx_recall_scoped
    version: 1.0.0
    description: >-
      Performs semantic search across persistent long-term memory to retrieve grounded facts, relevant citations, and source documents matching a natural language question. Use this tool when answering questions about previously saved project specifications, codebase decisions, user preferences, or documents. Do NOT use for saving new facts (use icx_remember), do NOT use for raw keyword lookup (use icx_search_facts), and do NOT use for exact character-for-character verbatim quotes (use icx_quote_slot). Read-only operation with zero side effects. Requires X-License-Key authentication.
    annotations:
      title: Scoped Memory Recall
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Natural language question, concept, or search prompt to recall relevant facts for.
        space_id:
          type: string
          description: Optional memory space partition to restrict recall to (e.g. 'default', 'codebase_docs'). Defaults to caller default space.
        top_k:
          type: number
          description: Maximum number of grounded facts to retrieve (default: 10, min: 1, max: 50).
      required:
        - query
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Recall status (VERIFIED_RECALL | NO_GROUNDED_FACTS_FOUND)
        query:
          type: string
          description: Natural language query submitted
        space_id:
          type: string
          description: Target memory space partition
        count:
          type: integer
          description: Number of grounded facts returned
        facts:
          type: array
          description: List of recalled grounded facts and citations
          items:
            type: object
        total_in_space:
          type: integer
          description: Total nodes in active memory space
      required:
        - status
        - query
        - space_id
        - count
        - facts
        - total_in_space

  - name: icx_search_facts
    version: 1.0.0
    description: >-
      Performs keyword and token search across persistent memory to discover entities, names, and matching terms within a memory space. Use this tool for entity exploration, keyword discovery, and locating specific identifiers or variables in memory. Do NOT use for answering natural language questions (use icx_recall_scoped), and do NOT use for writing data (use icx_remember). Read-only operation with zero side effects. Requires X-License-Key authentication.
    annotations:
      title: Search Simplicial Lattice Facts
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Search keywords, entity names, or token substrings to look up across memory nodes.
        space_id:
          type: string
          description: Optional memory space partition to search within. Defaults to caller default space.
        limit:
          type: number
          description: Maximum number of node matches to return (default: 20, min: 1, max: 100).
      required:
        - query
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Search status
        query:
          type: string
          description: Search keyword query
        space_id:
          type: string
          description: Target memory space partition
        count:
          type: integer
          description: Number of matching nodes found
        matches:
          type: array
          description: Simplicial complex nodes matching search query
          items:
            type: object
        total_in_space:
          type: integer
          description: Total nodes in active memory space
      required:
        - status
        - query
        - space_id
        - count
        - matches
        - total_in_space

  - name: icx_quote_slot
    version: 1.0.0
    description: >-
      Retrieves exact character-for-character verbatim text and cryptographic SHA-256 hashes from document registers by document family and 1-based slot index without AI paraphrasing. Use this tool when exact contractual wording, statutory clauses, license keys, or immutable code revisions must be quoted verbatim without AI modification. Do NOT use for semantic question answering (use icx_recall_scoped), and do NOT use for keyword exploration (use icx_search_facts). Read-only operation with zero side effects. Requires X-License-Key authentication.
    annotations:
      title: Verbatim Register Quoting
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        family:
          type: string
          description: Document family identifier specified during ingestion (e.g. 'contract.indemnity', 'msa.pricing', 'auth.tokens').
        index:
          type: number
          description: 1-based ordinal member index (e.g. 1 for first revision, 2 for second revision). Minimum: 1.
        space_id:
          type: string
          description: Optional memory space partition where the family was stored. Defaults to caller default space.
      required:
        - family
        - index
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Retrieval status (VERIFIED_VERBATIM_QUOTE | REGISTER_SLOT_EMPTY)
        family:
          type: string
          description: Document family category
        index:
          type: integer
          description: Ordinal slot index (1-based)
        space_id:
          type: string
          description: Target memory space partition
        exact_quote:
          type: string
          description: Verbatim character-exact text stored in register
        source_uri:
          type: string
          description: Original document source URI
        sha256:
          type: string
          description: Cryptographic content hash
      required:
        - status
        - family
        - index
        - space_id
        - exact_quote
        - source_uri
        - sha256

  - name: icx_inspect_space
    version: 1.0.0
    description: >-
      Audits and returns real-time diagnostic telemetry for a partitioned memory space, including active node counts, total synapses, grounded facts, memory state, and contradiction alarms. Use this tool to monitor memory partition health, verify document ingestion, check storage capacity, or detect contradiction alarms in a space. Do NOT use for querying memory content (use icx_recall_scoped or icx_quote_slot). Read-only operation with zero side effects. Requires X-License-Key authentication.
    annotations:
      title: Inspect Memory Space Telemetry
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        space_id:
          type: string
          description: Optional memory space partition to inspect. Defaults to caller default space ('default').
      required: []
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Space inspection status
        space_id:
          type: string
          description: Target memory space partition
        active_nodes:
          type: integer
          description: Active topological simplicial nodes
        total_synapses:
          type: integer
          description: Total learned neural synapses
        grounded_facts_count:
          type: integer
          description: Total decoded grounded facts
        contradictions_detected:
          type: integer
          description: Contradiction alarms in space
        state:
          type: string
          description: Memory space state (active | idle)
      required:
        - status
        - space_id
        - active_nodes
        - total_synapses
        - grounded_facts_count
        - contradictions_detected
        - state

  - name: icx_reset_session
    version: 1.0.0
    description: >-
      Clears conversational dialogue turn history for a session while strictly preserving all underlying persistent memory, learned facts, and document registers in the memory space. Use this tool when switching conversation topics or clearing dialogue context between independent tasks while retaining stored knowledge. Do NOT use for wiping persistent memory (persistent memory is preserved by design). Mutates session turn state but leaves long-term memory intact. Requires X-License-Key authentication.
    annotations:
      title: Reset Conversation History
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        space_id:
          type: string
          description: Optional memory space partition whose ephemeral session dialogue history should be reset. Defaults to caller default space.
      required: []
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Reset status (SESSION_RESET_SUCCESS)
        space_id:
          type: string
          description: Target memory space partition
        session_cleared:
          type: boolean
          description: Whether dialogue turns were cleared
        memory_crystallized_preserved:
          type: boolean
          description: Strictly true - underlying lattice memory is preserved
      required:
        - status
        - space_id
        - session_cleared
        - memory_crystallized_preserved

  - name: icx_sync_delta
    version: 1.1.0
    description: >-
      Extracts fine-grained deltas between previous text/document state and updated state, and crystallizes them into the Volumetric Memory lattice in sub-2ms on CPU with automatic secret scrubbing and SHA-256 deduplication. Use this tool for continuous incremental sync of code files, documentation, PRDs, and database schemas. Mutating operation. Requires X-License-Key authentication.
    annotations:
      title: Crystallize Incremental Delta
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        new_text:
          type: string
          description: New updated text/code/document state after modifications.
        old_text:
          type: string
          description: Previous text/code/document state before modifications.
        uri:
          type: string
          description: Document or file URI identifier (e.g. 'src/backend/engine.go', 'docs/rfc_42.md').
        source_id:
          type: string
          description: Optional connector or source identifier tracking provenance for instant purge. Defaults to 'mcp_sync'.
        space_id:
          type: string
          description: Optional memory space partition. Defaults to 'default'.
      required:
        - new_text
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Crystallization status (VERIFIED_CRYSTALLIZED | error)
        space_id:
          type: string
        uri:
          type: string
        deltas_processed:
          type: integer
        facts_learned:
          type: integer
        facts_invalidated:
          type: integer
        duration_ms:
          type: number
      required:
        - status
        - space_id
        - uri
        - deltas_processed
        - facts_learned
        - facts_invalidated
        - duration_ms

  - name: icx_list_connectors
    version: 1.1.0
    description: >-
      Lists all active cloud changefeed connectors (GitHub, GitLab, Notion, Google Drive, Linear, Slack, PostgreSQL) registered for the tenant. Read-only operation. Requires X-License-Key authentication.
    annotations:
      title: List Auto-Sync Connectors
      readOnlyHint: true
    inputSchema:
      type: object
      properties: {}
      required: []
    outputSchema:
      type: object
      properties:
        status:
          type: string
        total:
          type: integer
        connectors:
          type: array
          items:
            type: object
      required:
        - status
        - total
        - connectors

  - name: icx_register_connector
    version: 1.1.0
    description: >-
      Registers a new cloud webhook changefeed connector for continuous epistemic auto-sync with AES-256-GCM secret vaulting and HMAC signature verification. Mutating operation. Requires X-License-Key authentication.
    annotations:
      title: Register Auto-Sync Connector
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        type:
          type: string
          description: Connector source type ('github', 'gitlab', 'notion', 'gdrive', 'linear', 'slack', 'postgres', 'generic').
        name:
          type: string
          description: Human-readable name for the connector.
        target_uri:
          type: string
          description: Target repository URL, Notion workspace URL, or resource URI.
        webhook_secret:
          type: string
          description: Optional custom webhook secret or HMAC key.
      required:
        - type
        - name
        - target_uri
    outputSchema:
      type: object
      properties:
        status:
          type: string
        connector_id:
          type: string
        type:
          type: string
        name:
          type: string
        target_uri:
          type: string
        webhook_url:
          type: string
        webhook_secret:
          type: string
      required:
        - status
        - connector_id
        - type
        - name
        - target_uri
        - webhook_url

  - name: icx_purge_source
    version: 1.1.0
    description: >-
      Executes O(1) instant memory unlinking and revocation of all facts, simplices, and document associations learned from a specific data source or connector without requiring model retraining. Mutating operation. Requires X-License-Key authentication.
    annotations:
      title: O(1) Instant Source Memory Purge
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        source_id:
          type: string
          description: The source_id or connector_id whose facts should be instantly purged from tenant memory.
        space_id:
          type: string
          description: Optional memory space partition. Defaults to 'default'.
      required:
        - source_id
    outputSchema:
      type: object
      properties:
        status:
          type: string
        source_id:
          type: string
        unlinked_facts:
          type: integer
        message:
          type: string
      required:
        - status
        - source_id
        - unlinked_facts
        - message

  - name: icx_sync_audit
    version: 1.1.0
    description: >-
      Retrieves historical synchronization events, deltas processed, facts learned, and sub-2ms latency telemetry for compliance and audit auditing. Read-only operation. Requires X-License-Key authentication.
    annotations:
      title: Auto-Sync Audit Logs
      readOnlyHint: true
    inputSchema:
      type: object
      properties: {}
      required: []
    outputSchema:
      type: object
      properties:
        status:
          type: string
        total:
          type: integer
        audit_logs:
          type: array
          items:
            type: object
      required:
        - status
        - total
        - audit_logs

