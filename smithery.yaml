# Smithery MCP Server Manifest
# https://smithery.ai/docs/config

name: icx-mcp
title: Calera Infinite Context (ICX) — Persistent Memory
description: Persistent epistemic memory and sub-5ms associative recall on the Volumetric Lattice Network for AI agents and LLMs with zero context decay.
homepage: https://icx.caleralabs.com/mcp
icon: https://caleralabs.com/assets/calera-labs-logo.svg
license: Apache-2.0
publisher: Calera Labs
tags:
  - infinite-context
  - persistent-memory
  - memory
  - associative-recall
  - zero-loss
  - volumetric-lattice
  - calera-labs

# Transport configuration (Streamable Remote HTTP)
transport:
  type: http
  url: https://icx.caleralabs.com/mcp

# Authentication & Configuration Requirements (Smithery Session Config)
configSchema:
  type: object
  properties:
    licenseKey:
      type: string
      title: API License Key
      description: Calera Labs API key (obtain free at https://dashboard.caleralabs.com).
      x-from:
        header: X-License-Key
    spaceId:
      type: string
      title: Memory Space ID
      description: Optional memory partition space ID (e.g., 'default', 'project_alpha', 'legal_vault'). Defaults to 'default'.
      default: "default"
      x-from:
        header: X-Space-ID
  required:
    - licenseKey

config:
  type: object
  properties:
    X-License-Key:
      type: string
      title: Calera Labs API License Key
      description: Calera Labs API key (obtain free at https://dashboard.caleralabs.com).
      isSecret: true
      x-from:
        header: X-License-Key
    X-Space-ID:
      type: string
      title: Memory Space Partition ID
      description: Optional memory partition space ID (e.g., 'default', 'project_alpha', 'legal_vault'). Defaults to 'default'.
      default: "default"
      x-from:
        header: X-Space-ID
  required:
    - X-License-Key

# Certified 6-Tool Surface Area with Input & Output Schemas
tools:
  - name: icx_remember
    version: 0.4.0
    description: >-
      Crystallizes text, code, or structured knowledge into the persistent Volumetric Memory lattice.
      Ingests sentences into permanent topological simplicial nodes without context window token decay.
    annotations:
      title: Remember Context / Document
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        text:
          type: string
          description: Verbatim raw text, document chunk, or fact statement to crystallize into permanent memory.
        doc_id:
          type: string
          description: Unique document identifier or file path (e.g., 'contracts/master_services.pdf').
        family:
          type: string
          description: Semantic family category (e.g., 'contract', 'architecture', 'api_spec', 'general').
        title:
          type: string
          description: Human-readable title for the document.
      required:
        - text
    outputSchema:
      type: object
      properties:
        status:
          type: string
          description: Crystallization status (stored | error)
        doc_id:
          type: string
        crystallized_nodes:
          type: integer
        grounded_facts:
          type: integer
        stored_at:
          type: string

  - name: icx_recall_scoped
    version: 0.4.0
    description: >-
      Recalls exact grounded facts from the Volumetric Memory lattice matching a natural query.
      Returns zero-hallucination factual sentences, register slots, and document citations without attention diffusion.
    annotations:
      title: Recall Grounded Facts
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Natural language recall question or search topic (e.g., 'What is the indemnity cap in the Acme MSA?').
        space_id:
          type: string
          description: Optional memory partition namespace. Defaults to current session space.
        max_facts:
          type: integer
          description: Maximum number of grounded facts to return in viewport (default: 8, max: 32).
      required:
        - query
    outputSchema:
      type: object
      properties:
        query:
          type: string
        facts_count:
          type: integer
        viewport_grounded_facts:
          type: array
        citations:
          type: array
        latency_ms:
          type: number

  - name: icx_search_facts
    version: 0.4.0
    description: >-
      Searches simplicial lattice nodes and decoded facts by query keywords and manifold proximity.
    annotations:
      title: Search Fact Lattice
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Keyword phrase or entity name to locate across crystallized simplicial complexes.
        limit:
          type: integer
          description: Maximum number of facts to return (default: 10).
      required:
        - query
    outputSchema:
      type: object
      properties:
        query:
          type: string
        total_found:
          type: integer
        facts:
          type: array

  - name: icx_quote_slot
    version: 0.4.0
    description: >-
      Performs deterministic zero-LLM verbatim quote retrieval for a specific document family and ordinal slot index.
    annotations:
      title: Verbatim Slot Quote
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        family:
          type: string
          description: Document family (e.g., 'contract.indemnity', 'section.compliance').
        slot:
          type: integer
          description: Ordinal slot index (1-based integer).
      required:
        - family
        - slot
    outputSchema:
      type: object
      properties:
        family:
          type: string
        slot:
          type: integer
        exact_quote:
          type: string
        source_uri:
          type: string

  - name: icx_inspect_space
    version: 0.4.0
    description: >-
      Inspects active memory space telemetry: total crystallized simplicial nodes, synapses, decoded facts, and contradiction alarms.
    annotations:
      title: Inspect Memory Space Telemetry
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        space_id:
          type: string
          description: Memory partition space ID (defaults to 'default').
    outputSchema:
      type: object
      properties:
        space_id:
          type: string
        active_nodes:
          type: integer
        total_synapses:
          type: integer
        grounded_facts:
          type: integer
        contradictions_detected:
          type: integer
        state:
          type: string

  - name: icx_reset_session
    version: 0.4.0
    description: >-
      Resets active conversation dialogue history while strictly preserving all underlying crystallized knowledge and simplicial nodes.
    annotations:
      title: Reset Dialogue Session
      readOnlyHint: false
    inputSchema:
      type: object
      properties:
        space_id:
          type: string
          description: Space ID where dialogue history should be reset.
    outputSchema:
      type: object
      properties:
        space_id:
          type: string
        session_cleared:
          type: boolean
        memory_crystallized_preserved:
          type: boolean
