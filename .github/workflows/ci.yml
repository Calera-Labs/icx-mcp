name: CI & Manifest Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Node Gateway Syntax
        run: |
          node --check index.js

      - name: Validate JSON Manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('server.json'))"
          node -e "JSON.parse(require('fs').readFileSync('glama.json'))"

      - name: Test Docker Container Build
        run: |
          docker build -t icx-mcp:test .
